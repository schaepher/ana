<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>codeintel · 依赖探索</title>
  <script src="https://unpkg.com/@antv/g6@5.1.1/dist/g6.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f7f8fa; }
    #header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px; background: #1f1f2e; color: #fff; height: 52px;
    }
    #header h1 { font-size: 16px; font-weight: 600; }
    #header .legend { display: flex; gap: 14px; font-size: 12px; color: #c9c9d4; }
    #header .legend span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    #kind-legend-wrap { position: relative; }
    #kind-legend-btn {
      background: #2a2a3d; color: #c9c9d4; border: 1px solid #43435c;
      border-radius: 4px; font-size: 12px; padding: 2px 8px; cursor: pointer;
    }
    #kind-legend-btn:hover { color: #fff; }
    #kind-legend {
      position: absolute; top: calc(100% + 6px); right: 0; min-width: 190px;
      background: #fff; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.2);
      padding: 8px 10px; z-index: 30; max-height: calc(100vh - 80px); overflow-y: auto;
    }
    #kind-legend.hidden { display: none; }
    #kind-legend .lg-sec { font-size: 11px; color: #86909c; font-weight: 600; margin: 8px 0 3px; }
    #kind-legend .lg-sec:first-child { margin-top: 0; }
    #kind-legend .ki { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #333; padding: 3px 0; }
    #kind-legend .ki .lbl { flex: 1; }
    #kind-legend .sq {
      width: 10px; height: 10px; border-radius: 2px; display: inline-block;
      flex: 0 0 10px; background: #fff;
    }
    #hide-legend-wrap { position: relative; }
    #hide-legend-btn {
      background: #2a2a3d; color: #c9c9d4; border: 1px solid #43435c;
      border-radius: 4px; font-size: 12px; padding: 2px 8px; cursor: pointer;
    }
    #hide-legend-btn:hover { color: #fff; }
    #hide-legend {
      position: absolute; top: calc(100% + 6px); right: 0; min-width: 170px;
      background: #fff; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.2);
      padding: 8px 10px; z-index: 30;
    }
    #hide-legend.hidden { display: none; }
    #hide-legend .hl-tip { font-size: 11px; color: #86909c; margin-bottom: 6px; }
    #hide-legend label {
      display: flex; align-items: center; gap: 6px; font-size: 12px;
      color: #333; padding: 3px 0; cursor: pointer;
    }
    #hide-legend input { cursor: pointer; }
    #search-box { position: relative; flex: 1; max-width: 420px; margin: 0 16px; }
    #entry-input {
      width: 100%; padding: 6px 12px; border-radius: 6px; border: 1px solid #43435c;
      background: #2a2a3d; color: #fff; font-size: 13px; outline: none;
    }
    #entry-input:focus { border-color: #1677ff; }
    #entry-list {
      position: absolute; top: 100%; left: 0; right: 0; margin: 4px 0 0; padding: 4px 0;
      background: #fff; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.2);
      max-height: 300px; overflow-y: auto; display: none; list-style: none; z-index: 20;
    }
    #entry-list li {
      padding: 6px 12px; font-size: 12px; color: #333; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #entry-list li:hover { background: #e6f0ff; }
    #entry-list li .flags { color: #86909c; margin-left: 6px; }
    /* G6 v5 会给 #container 设内联 position:relative，故外层 #main-area
       承担定位（右侧让出 --panel-w 给信息栏），容器内部 100% 填充 */
    :root { --panel-w: 320px; }
    #main-area { position: absolute; top: 52px; left: 0; right: var(--panel-w); bottom: 0; background: #fff; }
    #container { width: 100%; height: 100%; }
    /* 侧边栏拖拽手柄（骑跨在画布/侧栏分界线上） */
    #panel-resize {
      position: absolute; top: 52px; bottom: 0; right: var(--panel-w); width: 6px;
      margin-right: -3px; cursor: col-resize; z-index: 16;
    }
    #panel-resize:hover { background: rgba(22, 119, 255, .15); }
    #tip {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(31,31,46,.85); color: #fff; padding: 8px 16px; border-radius: 6px;
      font-size: 13px; z-index: 10; pointer-events: none;
    }
    #sidepanel {
      position: absolute; top: 52px; right: 0; bottom: 0; width: var(--panel-w);
      background: #fff; border-left: 1px solid #e5e6eb;
      display: flex; flex-direction: column;
    }
    #panel-head {
      padding: 10px 14px; border-bottom: 1px solid #e5e6eb;
      font-size: 14px; font-weight: 600; color: #1f1f2e;
    }
    #panel-body { flex: 1; overflow-y: auto; padding: 12px 14px; font-size: 12px; color: #4e5969; }
    #panel-body h3 { font-size: 12px; color: #86909c; margin: 14px 0 6px; font-weight: 600; }
    #panel-body h3:first-child { margin-top: 0; }
    #panel-body .kv { display: flex; gap: 8px; margin: 3px 0; line-height: 1.6; }
    #panel-body .kv .k { color: #86909c; flex: 0 0 52px; }
    #panel-body .kv .v { flex: 1; word-break: break-all; }
    #panel-body .rel { display: flex; gap: 6px; align-items: baseline; margin: 4px 0; }
    #panel-body .rel .dir { color: #86909c; font-weight: 600; }
    #panel-body .rel .name { color: #1f1f2e; font-weight: 500; }
    #panel-body .rel .loc { color: #86909c; font-size: 11px; word-break: break-all; }
    #panel-body .hide-group-btn, #panel-body .expand-group-btn {
      border: 1px solid #d9d9d9; background: #fff; border-radius: 4px;
      font-size: 10px; color: #86909c; cursor: pointer; padding: 0 6px;
      margin-left: 4px; vertical-align: 1px;
    }
    #panel-body .hide-group-btn:hover { color: #f5222d; border-color: #f5222d; }
    #panel-body .expand-group-btn:hover { color: #1677ff; border-color: #1677ff; }
    #panel-body .file-group {
      margin-top: 6px; font-size: 11px; color: #86909c;
      font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-all;
    }
    #panel-body .file-group:first-of-type { margin-top: 0; }
    #panel-body .doc { line-height: 1.7; white-space: pre-wrap; }
    #panel-body .vt-row { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
      line-height: 1.6; word-break: break-all; }
    #panel-body .flows { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
      line-height: 1.6; white-space: pre-wrap; word-break: break-all; margin: 2px 0 8px; }
    #panel-body table.fields { width: 100%; border-collapse: collapse; margin: 4px 0 8px; }
    #panel-body table.fields th, #panel-body table.fields td {
      text-align: left; padding: 3px 6px; border-bottom: 1px solid #f0f0f0;
      font-size: 11px; word-break: break-all;
    }
    #panel-body table.fields th { color: #86909c; font-weight: 600; }
    #panel-body table.fields td.ftype { color: #1677ff; font-family: ui-monospace, Menlo, Consolas, monospace; }
    #source-btn {
      display: block; width: 100%; margin-bottom: 10px; padding: 6px 0;
      border: 1px solid #1677ff; border-radius: 6px; background: #fff;
      color: #1677ff; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    #source-btn:hover { background: #e6f0ff; }
    #modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    #modal.hidden { display: none; }
    #modal-box {
      width: min(900px, 88vw); height: min(560px, 80vh);
      background: #fff; border-radius: 8px; overflow: hidden;
      display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,.25);
    }
    #modal-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px; border-bottom: 1px solid #e5e6eb;
      font-size: 13px; font-weight: 600; color: #1f1f2e;
    }
    #modal-close { border: none; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: #86909c; }
    #modal-close:hover { color: #333; }
    #modal-code {
      flex: 1; margin: 0; padding: 14px 16px; overflow: auto;
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
      line-height: 1.6; color: #24292f; white-space: pre; tab-size: 4;
    }
    .loading { opacity: .5; pointer-events: none; }
  </style>
</head>
<body>
  <div id="header">
    <h1>codeintel · 依赖探索 <a href="/modules.html" style="font-size:12px;font-weight:400;color:#1677ff;margin-left:10px">模块间调用 →</a><a href="/er.html" style="font-size:12px;font-weight:400;color:#1677ff;margin-left:10px">数据库 ER →</a></h1>
    <div id="search-box">
      <input id="entry-input" type="text" placeholder="搜索顶层入口（main / 服务 / 框架回调）…" autocomplete="off">
      <ul id="entry-list"></ul>
    </div>
    <div class="legend">
      <div id="kind-legend-wrap">
        <button id="kind-legend-btn" title="节点类型 / 入口标记 / 连线类型 / 选中态图例">图例 ▾</button>
        <div id="kind-legend" class="hidden"></div>
      </div>
      <div id="hide-legend-wrap">
        <button id="hide-legend-btn" title="展开时隐藏哪些关系类型的兄弟">隐藏规则 ▾</button>
        <div id="hide-legend" class="hidden">
          <div class="hl-tip">展开时隐藏以下关系类型的兄弟节点</div>
          <div id="hide-list"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="main-area">
    <div id="tip">搜索并选择顶层入口后展示 · 双击节点展开/收起依赖 · 单击节点查看出入边</div>
    <div id="container"></div>
  </div>
  <div id="panel-resize" title="拖拽调整宽度"></div>
  <aside id="sidepanel">
    <div id="panel-head">节点信息</div>
    <div id="panel-body"><p class="doc">单击节点查看详细信息</p></div>
  </aside>
  <div id="modal" class="hidden">
    <div id="modal-box">
      <div id="modal-head">
        <span id="modal-title">Source Code</span>
        <button id="modal-close" title="关闭">×</button>
      </div>
      <pre id="modal-code"></pre>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
