<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>codeintel · 依赖探索</title>
  <script src="https://unpkg.com/@antv/g6@5/dist/g6.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f7f8fa; }
    #header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px; background: #1f1f2e; color: #fff; height: 52px;
    }
    #header h1 { font-size: 16px; font-weight: 600; }
    #header .legend { display: flex; gap: 14px; font-size: 12px; color: #c9c9d4; }
    #header .legend span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    #search-box { position: relative; flex: 1; max-width: 420px; margin: 0 16px; }
    #entry-input {
      width: 100%; padding: 6px 12px; border-radius: 6px; border: 1px solid #43435c;
      background: #2a2a3d; color: #fff; font-size: 13px; outline: none;
    }
    #entry-input:focus { border-color: #1677ff; }
    #entry-list {
      position: absolute; top: 100%; left: 0; right: 0; margin: 4px 0 0; padding: 4px 0;
      background: #fff; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.2);
      max-height: 300px; overflow-y: auto; display: none; list-style: none; z-index: 20;
    }
    #entry-list li {
      padding: 6px 12px; font-size: 12px; color: #333; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #entry-list li:hover { background: #e6f0ff; }
    #entry-list li .flags { color: #86909c; margin-left: 6px; }
    /* G6 v5 会给 #container 设内联 position:relative，故外层 #main-area
       承担定位（右侧让出 320px 给信息栏），容器内部 100% 填充 */
    #main-area { position: absolute; top: 52px; left: 0; right: 320px; bottom: 0; background: #fff; }
    #container { width: 100%; height: 100%; }
    #tip {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(31,31,46,.85); color: #fff; padding: 8px 16px; border-radius: 6px;
      font-size: 13px; z-index: 10; pointer-events: none;
    }
    #sidepanel {
      position: absolute; top: 52px; right: 0; bottom: 0; width: 320px;
      background: #fff; border-left: 1px solid #e5e6eb;
      display: flex; flex-direction: column;
    }
    #panel-head {
      padding: 10px 14px; border-bottom: 1px solid #e5e6eb;
      font-size: 14px; font-weight: 600; color: #1f1f2e;
    }
    #panel-body { flex: 1; overflow-y: auto; padding: 12px 14px; font-size: 12px; color: #4e5969; }
    #panel-body h3 { font-size: 12px; color: #86909c; margin: 14px 0 6px; font-weight: 600; }
    #panel-body h3:first-child { margin-top: 0; }
    #panel-body .kv { display: flex; gap: 8px; margin: 3px 0; line-height: 1.6; }
    #panel-body .kv .k { color: #86909c; flex: 0 0 52px; }
    #panel-body .kv .v { flex: 1; word-break: break-all; }
    #panel-body .rel { display: flex; gap: 6px; align-items: baseline; margin: 4px 0; }
    #panel-body .rel .dir { color: #86909c; font-weight: 600; }
    #panel-body .rel .name { color: #1f1f2e; font-weight: 500; }
    #panel-body .rel .loc { color: #86909c; font-size: 11px; word-break: break-all; }
    #panel-body .doc { line-height: 1.7; white-space: pre-wrap; }
    #panel-body table.fields { width: 100%; border-collapse: collapse; margin: 4px 0 8px; }
    #panel-body table.fields th, #panel-body table.fields td {
      text-align: left; padding: 3px 6px; border-bottom: 1px solid #f0f0f0;
      font-size: 11px; word-break: break-all;
    }
    #panel-body table.fields th { color: #86909c; font-weight: 600; }
    #panel-body table.fields td.ftype { color: #1677ff; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .loading { opacity: .5; pointer-events: none; }
  </style>
</head>
<body>
  <div id="header">
    <h1>codeintel · 依赖探索</h1>
    <div id="search-box">
      <input id="entry-input" type="text" placeholder="搜索顶层入口（main / 服务 / 框架回调）…" autocomplete="off">
      <ul id="entry-list"></ul>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:#eb2f96"></i>main 入口</span>
      <span><i class="dot" style="background:#fa541c"></i>HTTP 服务</span>
      <span><i class="dot" style="background:#f5222d"></i>gRPC 服务</span>
      <span><i class="dot" style="background:#531dab"></i>框架回调</span>
      <span style="color:#aaa">—</span>
      <span><i class="dot" style="background:#1677ff"></i>选中节点出边</span>
      <span><i class="dot" style="background:#f5222d"></i>选中节点入边</span>
      <span><i class="dot" style="background:#000"></i>默认</span>
    </div>
  </div>
  <div id="main-area">
    <div id="tip">搜索并选择顶层入口后展示 · 双击节点展开/收起依赖 · 单击节点查看出入边</div>
    <div id="container"></div>
  </div>
  <aside id="sidepanel">
    <div id="panel-head">节点信息</div>
    <div id="panel-body"><p class="doc">单击节点查看详细信息</p></div>
  </aside>
  <script src="app.js"></script>
</body>
</html>
