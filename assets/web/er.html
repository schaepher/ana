<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>codeintel 数据库 ER 图</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #333; }
  header { padding: 12px 20px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header a { color: #1677ff; text-decoration: none; }
  header .legend { display: flex; gap: 14px; font-size: 12px; color: #666; margin-left: auto; }
  header .legend .li { display: flex; align-items: center; gap: 5px; }
  .mode-switch { display: flex; border: 1px solid #d9d9d9; border-radius: 6px; overflow: hidden; }
  .mode-switch button { border: none; background: #fff; padding: 4px 12px; font-size: 12px; cursor: pointer; color: #666; }
  .mode-switch button + button { border-left: 1px solid #d9d9d9; }
  .mode-switch button.active { background: #2f54eb; color: #fff; }
  #svg-wrap { padding: 20px; overflow: auto; }
  svg { background: #fff; border: 1px solid #e8e8e8; display: block; }
  .tbl { fill: #fff; stroke: #c8c8c8; stroke-width: 1; }
  .tbl-head { fill: #2f54eb; }
  .tbl-title { fill: #fff; font-size: 13px; font-weight: 600; }
  .tbl-row { font-size: 12px; fill: #333; }
  .tbl-row-alt { fill: #f6f8fa; }
  .tbl-row text.col { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .acc { font-size: 10px; }
  .acc-write { fill: #d46b08; }
  .acc-read { fill: #1677ff; }
  .acc-filter { fill: #a8071a; }
  .edge-label { font-size: 10px; fill: #666; font-family: ui-monospace, Menlo, Consolas, monospace; }
  /* 嵌套画法：表外框 + 字段子矩形 */
  .nest-tbl { fill: #fafbfc; stroke: #5b6b7c; stroke-width: 1.5; }
  .nest-head { fill: #5b6b7c; }
  .nest-title { fill: #fff; font-size: 13px; font-weight: 600; }
  .nest-field { fill: #fff; stroke: #c8c8c8; stroke-width: 1; }
  .nest-anchor { stroke: none; }
</style>
</head>
<body>
<header>
  <a href="/">← 图探索</a>
  <strong>数据库 ER 图</strong>
  <span id="info" style="color:#999"></span>
  <div class="mode-switch">
    <button id="mode-tiled" class="active" title="表卡片平铺，字段行对齐连线">平铺画法</button>
    <button id="mode-nested" title="表外框内嵌字段矩形，字段矩形间连线">嵌套画法</button>
  </div>
  <div class="legend">
    <span class="li"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#1677ff" stroke-width="2.2"/></svg>键关联（高置信）</span>
    <span class="li"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#fa8c16" stroke-width="1.6" stroke-dasharray="6,3"/></svg>同源写（中置信）</span>
    <span class="li"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#b0b0b0" stroke-width="1" stroke-dasharray="2,3"/></svg>间接读（低置信）</span>
  </div>
</header>
<div id="svg-wrap"></div>
<script>
// ---- 平铺画法常量 ----
const W = 240, HEAD_H = 32, ROW_H = 22, PAD = 8;
const COL_GAP = 300, ROW_GAP = 90;
// ---- 嵌套画法常量：表外框内嵌字段矩形 ----
const TW = 260, TH_HEAD = 34, ROW_H2 = 26, PAD2 = 6, FIELD_M = 10;
const COL_GAP2 = 320, ROW_GAP2 = 130;

let DATA = null;   // /api/er 数据缓存（切换画法不重新拉取）
let MODE = 'tiled'; // tiled 平铺 / nested 嵌套

async function load() {
  const res = await fetch('/api/er');
  DATA = await res.json();
  const tables = DATA.tables || [], rels = DATA.relations || [];
  const q = rels.filter(r => r.type === 'query').length;
  document.getElementById('info').textContent =
    tables.length + ' 表 · ' + rels.length + ' 条关联（键 ' + q + ' / 写 ' + (rels.length - q - rels.filter(r => r.type === 'read').length) + ' / 读 ' + rels.filter(r => r.type === 'read').length + '）';
  render();
}

// 关系优先布局（两种画法共用）：BFS 连通分量 + 中心对称排列
// （关系最多表居中、邻居左右交替）——有关系的表同行相邻，连线不跨行
function buildOrder(tables, rels) {
  const N = tables.length;
  const deg = new Map();
  tables.forEach(t => deg.set(t.name, 0));
  const adj = new Map();
  tables.forEach(t => adj.set(t.name, []));
  rels.forEach(r => {
    deg.set(r.from_table, (deg.get(r.from_table) || 0) + 1);
    deg.set(r.to_table, (deg.get(r.to_table) || 0) + 1);
    adj.get(r.from_table).push(r.to_table);
    adj.get(r.to_table).push(r.from_table);
  });
  const sorted = tables.slice().sort((a, b) => (deg.get(b.name) || 0) - (deg.get(a.name) || 0));
  const order = [];
  const placed = new Set();
  let maxComp = 0;
  for (const t of sorted) {
    if (placed.has(t.name)) continue;
    const comp = [];
    const q = [t.name];
    placed.add(t.name);
    while (q.length) {
      const cur = q.shift();
      comp.push(cur);
      for (const nb of adj.get(cur) || []) {
        if (!placed.has(nb)) { placed.add(nb); q.push(nb); }
      }
    }
    maxComp = Math.max(maxComp, comp.length);
    const center = comp[0], rest = comp.slice(1);
    const left = [], right = [];
    rest.forEach((n, i) => (i % 2 === 0 ? left : right).push(n));
    left.reverse();
    order.push(...left, center, ...right);
  }
  const perRow = Math.max(2, Math.ceil(Math.sqrt(N)), Math.min(maxComp, 6));
  return { order, perRow };
}

// 网格定位：表名 → {x, y, w, h}
function placeTables(order, perRow, hOf) {
  const pos = new Map();
  const rows = [];
  order.forEach((name, i) => {
    const r = Math.floor(i / perRow);
    if (!rows[r]) rows[r] = { maxH: 0 };
    rows[r].maxH = Math.max(rows[r].maxH, hOf(name));
  });
  order.forEach((name, i) => {
    const r = Math.floor(i / perRow), c = i % perRow;
    pos.set(name, {
      x: 20 + c * (W + COL_GAP),
      y: 20 + rows.slice(0, r).reduce((s, rr) => s + rr.maxH + ROW_GAP, 0),
      w: W, h: hOf(name),
    });
  });
  const Wpx = perRow * (W + COL_GAP) - COL_GAP + 40;
  const Hpx = rows.reduce((s, rr) => s + rr.maxH + ROW_GAP, 0) - ROW_GAP + 40;
  return { pos, Wpx, Hpx };
}

function render() {
  document.getElementById('svg-wrap').innerHTML = '';
  if (!DATA) return;
  if (MODE === 'nested') renderNested(DATA);
  else renderTiled(DATA);
}

// ---- 平铺画法：表卡片 + 字段行对齐的 水平/S 型/斜线折线 ----
function renderTiled(data) {
  const tables = data.tables || [], rels = data.relations || [];
  const { order, perRow } = buildOrder(tables, rels);
  const tOf = name => tables.find(t => t.name === name);
  const cardH = t => HEAD_H + t.columns.length * ROW_H + PAD * 2;
  const { pos, Wpx, Hpx } = placeTables(order, perRow, name => cardH(tOf(name)));
  const colIdx = new Map();
  tables.forEach(t => {
    const m = new Map();
    t.columns.forEach((c, i) => m.set(c.name.includes('.') ? c.name.slice(c.name.indexOf('.') + 1) : c.name, i));
    colIdx.set(t.name, m);
  });
  let svg = svgHead(Wpx, Hpx);
  const lineCounts = new Map();
  for (const r of rels) {
    const pa = pos.get(r.from_table), pb = pos.get(r.to_table);
    if (!pa || !pb) continue;
    const ia = colIdx.get(r.from_table).get(r.from_col);
    const ib = colIdx.get(r.to_table).get(r.to_col);
    if (ia === undefined || ib === undefined) continue;
    const ay = pa.y + HEAD_H + ia * ROW_H + ROW_H / 2;
    const by = pb.y + HEAD_H + ib * ROW_H + ROW_H / 2;
    const OUT = 18;
    let ex1, ex2, dir;
    if (pa.x < pb.x) { ex1 = pa.x + pa.w; ex2 = pb.x; dir = 1; }
    else if (pa.x > pb.x) { ex1 = pa.x; ex2 = pb.x + pb.w; dir = -1; }
    else { ex1 = pa.x + pa.w / 2; ex2 = ex1; dir = 1; }
    const pairKey = [r.from_table, r.to_table].sort().join('|');
    const n = lineCounts.get(pairKey) || 0;
    lineCounts.set(pairKey, n + 1);
    let dx = 0;
    if (n > 0) dx = (n % 2 === 1 ? -1 : 1) * Math.ceil(n / 2) * 12;
    const style = edgeStyle(r.type);
    let d, mx, my;
    if (pa.y === pb.y) {
      if (ay === by) {
        d = `M ${ex1 + dx} ${ay} L ${ex2 + dx} ${ay}`;
        mx = (ex1 + ex2) / 2 + dx; my = ay - 6;
      } else {
        const vx = ex1 + dir * OUT;
        d = `M ${ex1 + dx} ${ay} L ${vx + dx} ${ay} L ${vx + dx} ${by} L ${ex2 + dx} ${by}`;
        mx = vx + dx; my = (ay + by) / 2 - 6;
      }
    } else {
      const hx1 = ex1 + dir * OUT, hx2 = ex2 - dir * OUT;
      d = `M ${ex1 + dx} ${ay} L ${hx1 + dx} ${ay} L ${hx2 + dx} ${by} L ${ex2 + dx} ${by}`;
      mx = (hx1 + hx2) / 2 + dx; my = (ay + by) / 2 - 6;
    }
    svg += `<path d="${d}" fill="none" style="${style}"/>`;
    svg += edgeLabel(mx, my, r, styleColor(r.type));
  }
  // 卡片
  for (const t of tables) {
    const p = pos.get(t.name), h = cardH(t);
    svg += `<rect class="tbl" x="${p.x}" y="${p.y}" width="${W}" height="${h}" rx="6"/>`;
    svg += `<rect class="tbl-head" x="${p.x}" y="${p.y}" width="${W}" height="${HEAD_H}" rx="6"/>`;
    svg += `<rect x="${p.x}" y="${p.y + HEAD_H - 6}" width="${W}" height="6" fill="#2f54eb"/>`;
    svg += `<text class="tbl-title" x="${p.x + 12}" y="${p.y + 21}">${t.name}</text>`;
    t.columns.forEach((c, i) => {
      const cy = p.y + HEAD_H + i * ROW_H + ROW_H - 6;
      if (i % 2 === 1) svg += `<rect class="tbl-row-alt" x="${p.x + 1}" y="${p.y + HEAD_H + i * ROW_H}" width="${W - 2}" height="${ROW_H}"/>`;
      svg += fieldText(p.x + 12, cy, c);
    });
  }
  svg += '</svg>';
  document.getElementById('svg-wrap').innerHTML = svg;
}

// ---- 嵌套画法：表外框内嵌字段矩形，字段矩形之间直线连线 ----
function renderNested(data) {
  const tables = data.tables || [], rels = data.relations || [];
  const { order, perRow } = buildOrder(tables, rels);
  const tOf = name => tables.find(t => t.name === name);
  const tableH = t => TH_HEAD + t.columns.length * ROW_H2 + PAD2;
  // 网格定位（间距用嵌套常量）
  const pos = new Map();
  const rows = [];
  order.forEach((name, i) => {
    const r = Math.floor(i / perRow);
    if (!rows[r]) rows[r] = { maxH: 0 };
    rows[r].maxH = Math.max(rows[r].maxH, tableH(tOf(name)));
  });
  order.forEach((name, i) => {
    const r = Math.floor(i / perRow), c = i % perRow;
    pos.set(name, {
      x: 20 + c * (TW + COL_GAP2),
      y: 20 + rows.slice(0, r).reduce((s, rr) => s + rr.maxH + ROW_GAP2, 0),
      w: TW, h: tableH(tOf(name)),
    });
  });
  const Wpx = perRow * (TW + COL_GAP2) - COL_GAP2 + 40;
  const Hpx = rows.reduce((s, rr) => s + rr.maxH + ROW_GAP2, 0) - ROW_GAP2 + 40;
  const colIdx = new Map();
  tables.forEach(t => {
    const m = new Map();
    t.columns.forEach((c, i) => m.set(c.name.includes('.') ? c.name.slice(c.name.indexOf('.') + 1) : c.name, i));
    colIdx.set(t.name, m);
  });
  // 字段矩形几何：{x, y, w, h}（表内）
  const fieldRect = (p, i) => ({
    x: p.x + FIELD_M, y: p.y + TH_HEAD + i * ROW_H2 + 2,
    w: TW - FIELD_M * 2, h: ROW_H2 - 4,
  });
  let svg = svgHead(Wpx, Hpx);
  // 先画表外框 + 字段矩形（底层），连线最后画（顶层）——
  // 线在所有表矩形之上，全程可见（含表内穿过的段落）
  for (const t of tables) {
    const p = pos.get(t.name);
    svg += `<rect class="nest-tbl" x="${p.x}" y="${p.y}" width="${TW}" height="${p.h}" rx="4"/>`;
    svg += `<rect class="nest-head" x="${p.x}" y="${p.y}" width="${TW}" height="${TH_HEAD}" rx="4"/>`;
    svg += `<rect x="${p.x}" y="${p.y + TH_HEAD - 6}" width="${TW}" height="6" fill="#5b6b7c"/>`;
    svg += `<text class="nest-title" x="${p.x + 12}" y="${p.y + 22}">${t.name}</text>`;
    t.columns.forEach((c, i) => {
      const fr = fieldRect(p, i);
      svg += `<rect class="nest-field" x="${fr.x}" y="${fr.y}" width="${fr.w}" height="${fr.h}"/>`;
      const cy = fr.y + fr.h / 2 + 4;
      svg += fieldText(fr.x + 8, cy, c);
    });
  }
  // 连线：字段矩形边缘 → 字段矩形边缘（折线 + 锚点圆点 + 箭头，最上层）
  const lineCounts = new Map();
  for (const r of rels) {
    const pa = pos.get(r.from_table), pb = pos.get(r.to_table);
    if (!pa || !pb) continue;
    const ia = colIdx.get(r.from_table).get(r.from_col);
    const ib = colIdx.get(r.to_table).get(r.to_col);
    if (ia === undefined || ib === undefined) continue;
    const fa = fieldRect(pa, ia), fb = fieldRect(pb, ib);
    // 边缘锚点（字段矩形边缘）：目标在右 → from 右缘 / to 左缘；目标在左 →
    // 对称；同列（上下行）→ 同侧右缘绕出
    let ex1, ex2, dir;
    if (pa.x < pb.x) { ex1 = fa.x + fa.w; ex2 = fb.x; dir = 1; }
    else if (pa.x > pb.x) { ex1 = fa.x; ex2 = fb.x + fb.w; dir = -1; }
    else { ex1 = fa.x + fa.w; ex2 = fb.x + fb.w; dir = 1; }
    const ay = fa.y + fa.h / 2, by = fb.y + fb.h / 2;
    const pairKey = [r.from_table, r.to_table].sort().join('|');
    const n = lineCounts.get(pairKey) || 0;
    lineCounts.set(pairKey, n + 1);
    const color = styleColor(r.type);
    // 端点固定字段矩形边缘中点（不偏移）；同对表平行线通过中间段落
    // 分叉（S 型出线段长度递增 / 水平线 y 微弯），线端始终贴边
    let d, mx, my;
    if (ay === by && ex1 !== ex2) {
      if (n === 0) {
        d = `M ${ex1} ${ay} L ${ex2} ${ay}`;
        mx = (ex1 + ex2) / 2; my = ay - 6;
      } else {
        // 水平直线多线：两端垂直微弯分叉（端点仍在字段矩形边缘）
        const off = (n % 2 === 1 ? -1 : 1) * Math.ceil(n / 2) * 5;
        d = `M ${ex1} ${ay} L ${ex1} ${ay + off} L ${ex2} ${ay + off} L ${ex2} ${ay}`;
        mx = (ex1 + ex2) / 2; my = ay + off - 6;
      }
    } else {
      // S 型正交：出线段长度随 n 递增（18/30/42…），垂直段在表外间隙
      const vx = ex1 + dir * (18 + n * 12);
      d = `M ${ex1} ${ay} L ${vx} ${ay} L ${vx} ${by} L ${ex2} ${by}`;
      mx = vx; my = (ay + by) / 2 - 6;
    }
    svg += `<path d="${d}" fill="none" style="${edgeStyle(r.type)}"/>`;
    // 锚点圆点（线端，精确落在字段矩形边缘）
    svg += `<circle class="nest-anchor" cx="${ex1}" cy="${ay}" r="3" fill="${color}"/>`;
    svg += `<circle class="nest-anchor" cx="${ex2}" cy="${by}" r="3" fill="${color}"/>`;
    svg += edgeLabel(mx, my, r, color);
  }
  svg += '</svg>';
  document.getElementById('svg-wrap').innerHTML = svg;
}

// ---- 公共小工具 ----
function svgHead(w, h) {
  return `<svg width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">` +
    `<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1677ff"/></marker></defs>`;
}
function styleColor(type) {
  return type === 'query' ? '#1677ff' : type === 'write' ? '#fa8c16' : '#b0b0b0';
}
function edgeStyle(type) {
  const color = styleColor(type);
  return type === 'query'
    ? `stroke:${color};stroke-width:2.2;marker-end:url(#arr)`
    : type === 'write'
      ? `stroke:${color};stroke-width:1.6;stroke-dasharray:6,3;marker-end:url(#arr)`
      : `stroke:${color};stroke-width:1;stroke-dasharray:2,3`;
}
function edgeLabel(x, y, r, color) {
  return `<text x="${x}" y="${y}" class="edge-label" text-anchor="middle">
    <tspan fill="${color}" font-weight="600">${r.from_col}</tspan> → ${r.to_col}
  </text>`;
}
function fieldText(x, y, c) {
  const colName = c.name.includes('.') ? c.name.slice(c.name.indexOf('.') + 1) : c.name;
  const acc = c.access === 'write' ? '写' : c.access === 'filter' ? '过滤' : c.access === 'read' ? '读' : c.access;
  const accClass = c.access === 'write' ? 'acc-write' : c.access === 'filter' ? 'acc-filter' : 'acc-read';
  const accText = acc ? `<tspan class="acc ${accClass}" dx="4">[${acc}]</tspan>` : '';
  return `<text class="tbl-row" x="${x}" y="${y}"><tspan class="col" title="${c.name}">${colName}</tspan>${accText}</text>`;
}

// 画法切换
function bindModeSwitch() {
  document.getElementById('mode-tiled').addEventListener('click', () => setMode('tiled'));
  document.getElementById('mode-nested').addEventListener('click', () => setMode('nested'));
  function setMode(m) {
    MODE = m;
    document.getElementById('mode-tiled').classList.toggle('active', m === 'tiled');
    document.getElementById('mode-nested').classList.toggle('active', m === 'nested');
    render();
  }
}
bindModeSwitch();
load();
</script>
</body>
</html>
