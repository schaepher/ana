<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>codeintel 数据库 ER 图</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #333; }
  header { padding: 12px 20px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header a { color: #1677ff; text-decoration: none; }
  header .legend { display: flex; gap: 14px; font-size: 12px; color: #666; margin-left: auto; }
  header .legend .li { display: flex; align-items: center; gap: 5px; }
  .mode-switch { display: flex; border: 1px solid #d9d9d9; border-radius: 6px; overflow: hidden; }
  .mode-switch button { border: none; background: #fff; padding: 4px 12px; font-size: 12px; cursor: pointer; color: #666; }
  .mode-switch button + button { border-left: 1px solid #d9d9d9; }
  .mode-switch button.active { background: #2f54eb; color: #fff; }
  .rel-filter { display: flex; gap: 12px; font-size: 12px; color: #555; align-items: center; }
  .rel-filter label { display: flex; align-items: center; gap: 3px; cursor: pointer; }
  #svg-wrap { padding: 20px; overflow: auto; }
  svg { background: #fff; border: 1px solid #e8e8e8; display: block; }
  .tbl { fill: #fff; stroke: #c8c8c8; stroke-width: 1; }
  .tbl-head { fill: #2f54eb; }
  .tbl-title { fill: #fff; font-size: 13px; font-weight: 600; }
  .tbl-row { font-size: 12px; fill: #333; }
  .tbl-row-alt { fill: #f6f8fa; }
  .tbl-row text.col { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .acc { font-size: 10px; }
  .acc-write { fill: #d46b08; }
  .acc-read { fill: #1677ff; }
  .acc-filter { fill: #a8071a; }
  .edge-label { font-size: 10px; fill: #666; font-family: ui-monospace, Menlo, Consolas, monospace; }
  /* 嵌套画法：表外框 + 字段子矩形 */
  .nest-tbl { fill: #fafbfc; stroke: #5b6b7c; stroke-width: 1.5; }
  .nest-head { fill: #5b6b7c; }
  .nest-title { fill: #fff; font-size: 13px; font-weight: 600; }
  .nest-field { fill: #fff; stroke: #c8c8c8; stroke-width: 1; }
  .nest-anchor { stroke: none; }
  /* 双击选中的表高亮 */
  .tbl.selected { stroke: #fa8c16; stroke-width: 2.5; }
  .tbl-head.selected { fill: #fa8c16; }
  .nest-tbl.selected { stroke: #fa8c16; stroke-width: 3; }
  .nest-head.selected { fill: #fa8c16; }
</style>
</head>
<body>
<header>
  <a href="/">← 图探索</a>
  <strong>数据库 ER 图</strong>
  <span id="info" style="color:#999"></span>
  <div class="mode-switch">
    <button id="mode-tiled" class="active" title="表卡片平铺，字段行对齐连线">平铺画法</button>
    <button id="mode-nested" title="表外框内嵌字段矩形，字段矩形间连线">嵌套画法</button>
  </div>
  <div class="rel-filter" title="关系显示开关（大规模表默认只画高置信键关联）">
    <label><input type="checkbox" id="f-query" checked>键关联</label>
    <label><input type="checkbox" id="f-write">同源写</label>
    <label><input type="checkbox" id="f-read">间接读</label>
  </div>
  <div class="legend">
    <span class="li"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#1677ff" stroke-width="2.2"/></svg>键关联（实线）</span>
    <span class="li"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#fa8c16" stroke-width="1.6" stroke-dasharray="6,3"/></svg>同源写（虚线）</span>
    <span class="li"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#b0b0b0" stroke-width="1" stroke-dasharray="2,3"/></svg>间接读（点线）</span>
    <span class="li" style="color:#999">颜色区分不同关系</span>
  </div>
</header>
<div id="svg-wrap"></div>
<script>
// ---- 平铺画法常量 ----
const W = 240, HEAD_H = 32, ROW_H = 22, PAD = 8;
const COL_GAP = 300, ROW_GAP = 90;
// ---- 嵌套画法常量：表外框内嵌字段矩形 ----
const TW = 260, TH_HEAD = 34, ROW_H2 = 26, PAD2 = 6, FIELD_M = 10;
const COL_GAP2 = 320, ROW_GAP2 = 130;

let DATA = null;   // /api/er 数据缓存（切换画法不重新拉取）
let MODE = 'tiled'; // tiled 平铺 / nested 嵌套
let SHOW = { query: true, write: false, read: false }; // 关系显示开关（默认只画高置信键关联）
let SELECTED = new Set(); // 双击展开的表集合（空=不画线；展开后只显示相关表与其关系）
// 每条线独立配色（循环调色板；线型仍表达类型：实线=键关联/虚线=同源写/点线=间接读）
const PALETTE = ['#1677ff', '#fa8c16', '#52c41a', '#f5222d', '#722ed1', '#13c2c2',
  '#eb2f96', '#a0d911', '#2f54eb', '#faad14', '#08979c', '#d4380d'];

async function load() {
  const res = await fetch('/api/er');
  DATA = await res.json();
  render();
}

// 按显示开关过滤关系（大规模表同源写/间接读成千上万，默认只画键关联）
function visibleRels() {
  const rels = (DATA.relations || []);
  const out = rels.filter(r => SHOW[r.type] !== false);
  const q = out.filter(r => r.type === 'query').length;
  let info = (DATA.tables || []).length + ' 表 · ' + out.length + ' 条关联（键 ' + q +
    ' / 写 ' + out.filter(r => r.type === 'write').length +
    ' / 读 ' + out.filter(r => r.type === 'read').length + '）';
  if (SELECTED.size > 0) {
    const n = out.filter(r => SELECTED.has(r.from_table) || SELECTED.has(r.to_table)).length;
    info += ' · 展开 ' + [...SELECTED].join(', ') + '（' + n + ' 条线）';
  }
  info += ' · 双击表展开/收起其关联线';
  document.getElementById('info').textContent = info;
  return out;
}

// 关系类型开关（localStorage 持久化）
function bindRelFilter() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem('codeintel.erShow')); } catch (e) { return null; } })();
  if (saved) SHOW = Object.assign(SHOW, saved);
  ['query', 'write', 'read'].forEach(t => {
    const cb = document.getElementById('f-' + t);
    cb.checked = SHOW[t] !== false;
    cb.addEventListener('change', () => {
      SHOW[t] = cb.checked;
      localStorage.setItem('codeintel.erShow', JSON.stringify(SHOW));
      render();
    });
  });
}

// 关系优先布局（两种画法共用）：BFS 连通分量 + 中心对称排列
// （关系最多表居中、邻居左右交替）——有关系的表同行相邻，连线不跨行
function buildOrder(tables, rels) {
  const N = tables.length;
  const deg = new Map();
  tables.forEach(t => deg.set(t.name, 0));
  const adj = new Map();
  tables.forEach(t => adj.set(t.name, []));
  rels.forEach(r => {
    // 展开模式：rels 可能包含已被隐藏的表——跳过，避免 undefined 崩溃
    if (!deg.has(r.from_table) || !deg.has(r.to_table)) return;
    deg.set(r.from_table, (deg.get(r.from_table) || 0) + 1);
    deg.set(r.to_table, (deg.get(r.to_table) || 0) + 1);
    adj.get(r.from_table).push(r.to_table);
    adj.get(r.to_table).push(r.from_table);
  });
  const sorted = tables.slice().sort((a, b) => (deg.get(b.name) || 0) - (deg.get(a.name) || 0));
  const order = [];
  const placed = new Set();
  let maxComp = 0;
  for (const t of sorted) {
    if (placed.has(t.name)) continue;
    const comp = [];
    const q = [t.name];
    placed.add(t.name);
    while (q.length) {
      const cur = q.shift();
      comp.push(cur);
      for (const nb of adj.get(cur) || []) {
        if (!placed.has(nb)) { placed.add(nb); q.push(nb); }
      }
    }
    maxComp = Math.max(maxComp, comp.length);
    const center = comp[0], rest = comp.slice(1);
    const left = [], right = [];
    rest.forEach((n, i) => (i % 2 === 0 ? left : right).push(n));
    left.reverse();
    order.push(...left, center, ...right);
  }
  const perRow = Math.max(2, Math.ceil(Math.sqrt(N)), Math.min(maxComp, 6));
  return { order, perRow };
}

// 网格定位：表名 → {x, y, w, h}；layout 供正交绕障布线用
// （每表行列、每行高度与起始 y、列/行间隙中心）
function placeTables(order, perRow, hOf, tw, colGap, rowGap) {
  const pos = new Map();
  const rows = [];
  order.forEach((name, i) => {
    const r = Math.floor(i / perRow);
    if (!rows[r]) rows[r] = { maxH: 0 };
    rows[r].maxH = Math.max(rows[r].maxH, hOf(name));
  });
  const rowOf = new Map(), colOf = new Map();
  const rowsTop = [], rowsMaxH = [];
  let y = 20;
  rows.forEach((rr, r) => {
    rowsTop.push(y);
    rowsMaxH.push(rr.maxH);
    y += rr.maxH + rowGap;
  });
  order.forEach((name, i) => {
    const r = Math.floor(i / perRow), c = i % perRow;
    rowOf.set(name, r);
    colOf.set(name, c);
    pos.set(name, { x: 20 + c * (tw + colGap), y: rowsTop[r], w: tw, h: hOf(name) });
  });
  const Wpx = perRow * (tw + colGap) - colGap + 40;
  const Hpx = y - rowGap + 20;
  return {
    pos, rowOf, colOf, rowsTop, rowsMaxH, perRow, Wpx, Hpx,
    // 列间隙中心 x（最右列取左侧间隙）、行间隙中心 y
    colGapX: c => {
      const cx = 20 + c * (tw + colGap);
      return c < perRow - 1 ? cx + tw + colGap / 2 : cx - colGap / 2;
    },
    rowGapY: r => rowsTop[r] + rowsMaxH[r] + rowGap / 2,
  };
}

// 正交绕障路径：线沿"列间隙 + 行间隙"通道走，不越过任何表矩形。
// 同行相邻表 → 直线/S 型（垂直段在同列间隙内）；其余 → 6 段绕行
// （字段边缘水平出 → 列通道垂直 → 行通道水平 → 列通道垂直 → 水平入）。
// 通道 x/y 位于表矩形之外，跨行跨列段落只经过间隙，绝不穿表。
function orthPath(ex1, ay, ex2, by, rowA, colA, rowB, colB, L, n, outN, inN) {
  n = n || 0; outN = outN || 0; inN = inN || 0;
  const fan = k => (k % 2 === 1 ? -1 : 1) * Math.ceil(k / 2); // 分叉偏移量（左右交替）
  if (rowA === rowB && Math.abs(colA - colB) === 1) {
    if (ay === by) {
      if (!n) {
        return { d: `M ${ex1} ${ay} L ${ex2} ${ay}`, mx: (ex1 + ex2) / 2, my: ay - 6 };
      }
      // 多线：两端垂直微弯分叉（端点仍在表边）
      const off = fan(n) * 5;
      return {
        d: `M ${ex1} ${ay} L ${ex1} ${ay + off} L ${ex2} ${ay + off} L ${ex2} ${ay}`,
        mx: (ex1 + ex2) / 2, my: ay + off - 6,
      };
    }
    // S 型：垂直段在同列间隙内，出线段长度按出端点计数递增（同表多线不重合）
    const vx = ex1 + (colB > colA ? 1 : -1) * (18 + outN * 12);
    return { d: `M ${ex1} ${ay} L ${vx} ${ay} L ${vx} ${by} L ${ex2} ${by}`, mx: vx, my: (ay + by) / 2 - 6 };
  }
  if (rowA === rowB && colA === colB) {
    // 同列跨行：同一列通道垂直直连（多线水平段错开）
    const cx = L.colGapX(colA) + fan(outN) * 8;
    return {
      d: `M ${ex1} ${ay} L ${cx} ${ay} L ${cx} ${by} L ${ex2} ${by}`,
      mx: cx, my: (ay + by) / 2 - 6,
    };
  }
  const cx1 = L.colGapX(colA) + fan(outN) * 8, cx2 = L.colGapX(colB) + fan(inN) * 8;
  const gapY = L.rowGapY(Math.min(rowA, rowB)) + fan(outN) * 8;
  return {
    d: `M ${ex1} ${ay} L ${cx1} ${ay} L ${cx1} ${gapY} L ${cx2} ${gapY} L ${cx2} ${by} L ${ex2} ${by}`,
    mx: (cx1 + cx2) / 2, my: gapY - 6,
  };
}

function render() {
  document.getElementById('svg-wrap').innerHTML = '';
  if (!DATA) return;
  const rels = visibleRels(); // SHOW 过滤后的全量（统计用）
  let tables = DATA.tables || [];
  let draw = [];
  if (SELECTED.size > 0) {
    // 画线：只画与任一展开表相关的关系
    draw = rels.filter(r => SELECTED.has(r.from_table) || SELECTED.has(r.to_table));
    // 隐藏无关表：保留展开表 + 有线的表，重新布局渲染
    const keep = new Set();
    draw.forEach(r => { keep.add(r.from_table); keep.add(r.to_table); });
    SELECTED.forEach(s => keep.add(s));
    tables = tables.filter(t => keep.has(t.name));
  }
  const data = { tables, relations: rels };
  if (MODE === 'nested') renderNested(data, rels, draw);
  else renderTiled(data, rels, draw);
}

// 双击表 → 展开/收起（多选：可同时展开多个表）
function bindDblClick() {
  document.getElementById('svg-wrap').addEventListener('dblclick', evt => {
    const el = evt.target.closest('[data-tbl]');
    if (!el) return;
    const name = el.getAttribute('data-tbl');
    if (SELECTED.has(name)) SELECTED.delete(name); else SELECTED.add(name);
    render();
  });
}

// ---- 平铺画法：表卡片 + 正交绕障折线（不越过任何表）----
function renderTiled(data, rels, draw) {
  const tables = data.tables || [];
  const { order, perRow } = buildOrder(tables, rels);
  const tOf = name => tables.find(t => t.name === name);
  const cardH = t => HEAD_H + t.columns.length * ROW_H + PAD * 2;
  const L = placeTables(order, perRow, name => cardH(tOf(name)), W, COL_GAP, ROW_GAP);
  const { pos } = L;
  const colIdx = new Map();
  tables.forEach(t => {
    const m = new Map();
    t.columns.forEach((c, i) => m.set(c.name.includes('.') ? c.name.slice(c.name.indexOf('.') + 1) : c.name, i));
    colIdx.set(t.name, m);
  });
  let svg = svgHead(L.Wpx, L.Hpx);
  const lineCounts = new Map(), outCounts = new Map(), inCounts = new Map();
  let lineIdx = 0;
  for (const r of draw) {
    const pa = pos.get(r.from_table), pb = pos.get(r.to_table);
    if (!pa || !pb) continue;
    const ia = colIdx.get(r.from_table).get(r.from_col);
    const ib = colIdx.get(r.to_table).get(r.to_col);
    if (ia === undefined || ib === undefined) continue;
    const ay = pa.y + HEAD_H + ia * ROW_H + ROW_H / 2;
    const by = pb.y + HEAD_H + ib * ROW_H + ROW_H / 2;
    // 端点 = 卡片边缘中点（目标侧；同列都从右缘绕出）
    let ex1, ex2;
    if (pa.x < pb.x) { ex1 = pa.x + pa.w; ex2 = pb.x; }
    else if (pa.x > pb.x) { ex1 = pa.x; ex2 = pb.x + pb.w; }
    else { ex1 = pa.x + pa.w; ex2 = pb.x + pb.w; }
    const pairKey = [r.from_table, r.to_table].sort().join('|');
    const n = lineCounts.get(pairKey) || 0;
    lineCounts.set(pairKey, n + 1);
    // 端点分叉：同出端（表+字段+方向）出线段递增、同入端入线段偏移——
    // 多线共享端点时不重合
    const dir = pa.x < pb.x ? 1 : pa.x > pb.x ? -1 : 1;
    const outKey = r.from_table + '>' + r.from_col + (dir > 0 ? 'R' : 'L');
    const outN = outCounts.get(outKey) || 0;
    outCounts.set(outKey, outN + 1);
    const inKey = r.to_table + '>' + r.to_col;
    const inN = inCounts.get(inKey) || 0;
    inCounts.set(inKey, inN + 1);
    const lineColor = PALETTE[lineIdx % PALETTE.length];
    lineIdx++;
    const p = orthPath(ex1, ay, ex2, by,
      L.rowOf.get(r.from_table), L.colOf.get(r.from_table),
      L.rowOf.get(r.to_table), L.colOf.get(r.to_table), L, n, outN, inN);
    svg += `<path d="${p.d}" fill="none" style="${edgeStyle(r.type, lineColor)}"/>`;
    svg += edgeLabel(p.mx, p.my, r, lineColor);
  }
  // 卡片
  for (const t of tables) {
    const p = pos.get(t.name), h = cardH(t);
    const sel = SELECTED.has(t.name) ? ' selected' : '';
    svg += `<rect class="tbl${sel}" data-tbl="${t.name}" x="${p.x}" y="${p.y}" width="${W}" height="${h}" rx="6"/>`;
    svg += `<rect class="tbl-head${sel}" data-tbl="${t.name}" x="${p.x}" y="${p.y}" width="${W}" height="${HEAD_H}" rx="6"/>`;
    svg += `<rect x="${p.x}" y="${p.y + HEAD_H - 6}" width="${W}" height="6" fill="#2f54eb"/>`;
    svg += `<text class="tbl-title" x="${p.x + 12}" y="${p.y + 21}">${t.name}</text>`;
    t.columns.forEach((c, i) => {
      const cy = p.y + HEAD_H + i * ROW_H + ROW_H - 6;
      if (i % 2 === 1) svg += `<rect class="tbl-row-alt" x="${p.x + 1}" y="${p.y + HEAD_H + i * ROW_H}" width="${W - 2}" height="${ROW_H}"/>`;
      svg += fieldText(p.x + 12, cy, c);
    });
  }
  svg += '</svg>';
  document.getElementById('svg-wrap').innerHTML = svg;
}

// ---- 嵌套画法：表外框内嵌字段矩形，字段矩形之间直线连线 ----
function renderNested(data, rels, draw) {
  const tables = data.tables || [];
  const { order, perRow } = buildOrder(tables, rels);
  const tOf = name => tables.find(t => t.name === name);
  const tableH = t => TH_HEAD + t.columns.length * ROW_H2 + PAD2;
  const L = placeTables(order, perRow, name => tableH(tOf(name)), TW, COL_GAP2, ROW_GAP2);
  const { pos } = L;
  const colIdx = new Map();
  tables.forEach(t => {
    const m = new Map();
    t.columns.forEach((c, i) => m.set(c.name.includes('.') ? c.name.slice(c.name.indexOf('.') + 1) : c.name, i));
    colIdx.set(t.name, m);
  });
  // 字段矩形几何：{x, y, w, h}（表内）
  const fieldRect = (p, i) => ({
    x: p.x + FIELD_M, y: p.y + TH_HEAD + i * ROW_H2 + 2,
    w: TW - FIELD_M * 2, h: ROW_H2 - 4,
  });
  let svg = svgHead(L.Wpx, L.Hpx);
  // 先画表外框 + 字段矩形（底层），连线最后画（顶层）——
  // 线在所有表矩形之上，全程可见（含表内穿过的段落）
  for (const t of tables) {
    const p = pos.get(t.name);
    const sel = SELECTED.has(t.name) ? ' selected' : '';
    svg += `<rect class="nest-tbl${sel}" data-tbl="${t.name}" x="${p.x}" y="${p.y}" width="${TW}" height="${p.h}" rx="4"/>`;
    svg += `<rect class="nest-head${sel}" data-tbl="${t.name}" x="${p.x}" y="${p.y}" width="${TW}" height="${TH_HEAD}" rx="4"/>`;
    svg += `<rect x="${p.x}" y="${p.y + TH_HEAD - 6}" width="${TW}" height="6" fill="#5b6b7c"/>`;
    svg += `<text class="nest-title" x="${p.x + 12}" y="${p.y + 22}">${t.name}</text>`;
    t.columns.forEach((c, i) => {
      const fr = fieldRect(p, i);
      svg += `<rect class="nest-field" x="${fr.x}" y="${fr.y}" width="${fr.w}" height="${fr.h}"/>`;
      const cy = fr.y + fr.h / 2 + 4;
      svg += fieldText(fr.x + 8, cy, c);
    });
  }
  // 连线：字段矩形边缘 → 字段矩形边缘（正交绕障折线 + 锚点圆点，最上层）
  const lineCounts = new Map(), outCounts = new Map(), inCounts = new Map();
  let lineIdx = 0;
  for (const r of draw) {
    const pa = pos.get(r.from_table), pb = pos.get(r.to_table);
    if (!pa || !pb) continue;
    const ia = colIdx.get(r.from_table).get(r.from_col);
    const ib = colIdx.get(r.to_table).get(r.to_col);
    if (ia === undefined || ib === undefined) continue;
    const fa = fieldRect(pa, ia), fb = fieldRect(pb, ib);
    // 端点 = 字段矩形边缘中点（目标侧；同列都从右缘绕出），始终贴边
    let ex1, ex2;
    if (pa.x < pb.x) { ex1 = fa.x + fa.w; ex2 = fb.x; }
    else if (pa.x > pb.x) { ex1 = fa.x; ex2 = fb.x + fb.w; }
    else { ex1 = fa.x + fa.w; ex2 = fb.x + fb.w; }
    const ay = fa.y + fa.h / 2, by = fb.y + fb.h / 2;
    const pairKey = [r.from_table, r.to_table].sort().join('|');
    const n = lineCounts.get(pairKey) || 0;
    lineCounts.set(pairKey, n + 1);
    const dir = pa.x < pb.x ? 1 : pa.x > pb.x ? -1 : 1;
    const outKey = r.from_table + '>' + r.from_col + (dir > 0 ? 'R' : 'L');
    const outN = outCounts.get(outKey) || 0;
    outCounts.set(outKey, outN + 1);
    const inKey = r.to_table + '>' + r.to_col;
    const inN = inCounts.get(inKey) || 0;
    inCounts.set(inKey, inN + 1);
    const color = PALETTE[lineIdx % PALETTE.length];
    lineIdx++;
    const p = orthPath(ex1, ay, ex2, by,
      L.rowOf.get(r.from_table), L.colOf.get(r.from_table),
      L.rowOf.get(r.to_table), L.colOf.get(r.to_table), L, n, outN, inN);
    svg += `<path d="${p.d}" fill="none" style="${edgeStyle(r.type, color)}"/>`;
    // 锚点圆点（线端，精确落在字段矩形边缘）
    svg += `<circle class="nest-anchor" cx="${ex1}" cy="${ay}" r="3" fill="${color}"/>`;
    svg += `<circle class="nest-anchor" cx="${ex2}" cy="${by}" r="3" fill="${color}"/>`;
    svg += edgeLabel(p.mx, p.my, r, color);
  }
  svg += '</svg>';
  document.getElementById('svg-wrap').innerHTML = svg;
}

// ---- 公共小工具 ----
function svgHead(w, h) {
  return `<svg width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">`;
}
function styleColor(type) {
  return type === 'query' ? '#1677ff' : type === 'write' ? '#fa8c16' : '#b0b0b0';
}
function edgeStyle(type, color) {
  return type === 'query'
    ? `stroke:${color};stroke-width:2.2`
    : type === 'write'
      ? `stroke:${color};stroke-width:1.6;stroke-dasharray:6,3`
      : `stroke:${color};stroke-width:1;stroke-dasharray:2,3`;
}
function edgeLabel(x, y, r, color) {
  return `<text x="${x}" y="${y}" class="edge-label" text-anchor="middle">
    <tspan fill="${color}" font-weight="600">${r.from_col}</tspan> → ${r.to_col}
  </text>`;
}
function fieldText(x, y, c) {
  const colName = c.name.includes('.') ? c.name.slice(c.name.indexOf('.') + 1) : c.name;
  const acc = c.access === 'write' ? '写' : c.access === 'filter' ? '过滤' : c.access === 'read' ? '读' : c.access;
  const accClass = c.access === 'write' ? 'acc-write' : c.access === 'filter' ? 'acc-filter' : 'acc-read';
  const accText = acc ? `<tspan class="acc ${accClass}" dx="4">[${acc}]</tspan>` : '';
  return `<text class="tbl-row" x="${x}" y="${y}"><tspan class="col" title="${c.name}">${colName}</tspan>${accText}</text>`;
}

// 画法切换
function bindModeSwitch() {
  document.getElementById('mode-tiled').addEventListener('click', () => setMode('tiled'));
  document.getElementById('mode-nested').addEventListener('click', () => setMode('nested'));
  function setMode(m) {
    MODE = m;
    document.getElementById('mode-tiled').classList.toggle('active', m === 'tiled');
    document.getElementById('mode-nested').classList.toggle('active', m === 'nested');
    render();
  }
}
bindRelFilter();
bindModeSwitch();
bindDblClick();
load();
</script>
