<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>codeintel 数据库 ER 图</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #333; }
  header { padding: 12px 20px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header a { color: #1677ff; text-decoration: none; }
  header .legend { display: flex; gap: 14px; font-size: 12px; color: #666; margin-left: auto; }
  header .legend .li { display: flex; align-items: center; gap: 5px; }
  #svg-wrap { padding: 20px; overflow: auto; }
  svg { background: #fff; border: 1px solid #e8e8e8; display: block; }
  .tbl { fill: #fff; stroke: #c8c8c8; stroke-width: 1; }
  .tbl-head { fill: #2f54eb; }
  .tbl-title { fill: #fff; font-size: 13px; font-weight: 600; }
  .tbl-row { font-size: 12px; fill: #333; }
  .tbl-row-alt { fill: #f6f8fa; }
  .tbl-row text.col { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .acc { font-size: 10px; }
  .acc-write { fill: #d46b08; }
  .acc-read { fill: #1677ff; }
  .acc-filter { fill: #a8071a; }
  .edge-label { font-size: 10px; fill: #666; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .edge-label strong { font-weight: 600; }
</style>
</head>
<body>
<header>
  <a href="/">← 图探索</a>
  <strong>数据库 ER 图</strong>
  <span id="info" style="color:#999"></span>
  <div class="legend">
    <span class="li"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#1677ff" stroke-width="2.2"/></svg>键关联（高置信）</span>
    <span class="li"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#fa8c16" stroke-width="1.6" stroke-dasharray="6,3"/></svg>同源写（中置信）</span>
    <span class="li"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#b0b0b0" stroke-width="1" stroke-dasharray="2,3"/></svg>间接读（低置信）</span>
  </div>
</header>
<div id="svg-wrap"></div>
<script>
const W = 240, HEAD_H = 32, ROW_H = 22, PAD = 8;
const COL_GAP = 300, ROW_GAP = 90;

async function load() {
  const res = await fetch('/api/er');
  const data = await res.json();
  const tables = data.tables || [], rels = data.relations || [];
  const q = rels.filter(r => r.type === 'query').length;
  document.getElementById('info').textContent =
    tables.length + ' 表 · ' + rels.length + ' 条关联（键 ' + q + ' / 写 ' + (rels.length - q - rels.filter(r=>r.type==='read').length) + ' / 读 ' + rels.filter(r=>r.type==='read').length + '）';
  render(tables, rels);
}

function cardH(tbl) { return HEAD_H + tbl.columns.length * ROW_H + PAD * 2; }

function render(tables, rels) {
  const N = tables.length;
  // 关系优先布局：BFS 分量 + 中心对称（关系最多表居中，邻居左右交替），
  // 有关系的表同行相邻——字段行对齐后水平线/S 型线不再斜穿卡片
  const deg = new Map();
  tables.forEach(t => deg.set(t.name, 0));
  const adj = new Map();
  tables.forEach(t => adj.set(t.name, []));
  rels.forEach(r => {
    deg.set(r.from_table, (deg.get(r.from_table) || 0) + 1);
    deg.set(r.to_table, (deg.get(r.to_table) || 0) + 1);
    adj.get(r.from_table).push(r.to_table);
    adj.get(r.to_table).push(r.from_table);
  });
  const sorted = tables.slice().sort((a, b) => (deg.get(b.name) || 0) - (deg.get(a.name) || 0));
  const order = []; // 表名顺序（分量连续，分量内中心对称）
  const placed = new Set();
  let maxComp = 0;
  for (const t of sorted) {
    if (placed.has(t.name)) continue;
    // BFS 连通分量
    const comp = [];
    const q = [t.name];
    placed.add(t.name);
    while (q.length) {
      const cur = q.shift();
      comp.push(cur);
      for (const nb of adj.get(cur) || []) {
        if (!placed.has(nb)) { placed.add(nb); q.push(nb); }
      }
    }
    maxComp = Math.max(maxComp, comp.length);
    // 中心对称：分量首表（度最大）居中，其余左右交替
    const center = comp[0], rest = comp.slice(1);
    const left = [], right = [];
    rest.forEach((n, i) => (i % 2 === 0 ? left : right).push(n));
    left.reverse();
    order.push(...left, center, ...right);
  }
  // 列数：分量尽量同行排开（上限 6 防超宽），无关系的表按 sqrt 网格
  const perRow = Math.max(2, Math.ceil(Math.sqrt(N)), Math.min(maxComp, 6));
  // 行填充：按 order 顺序（分量连续 → 同行相邻）
  const rows = [];
  order.forEach((name, i) => {
    const r = Math.floor(i / perRow);
    if (!rows[r]) rows[r] = { maxH: 0, cards: [] };
    rows[r].cards.push(name);
    rows[r].maxH = Math.max(rows[r].maxH, cardH(tables.find(t => t.name === name)));
  });
  const pos = new Map(); // 表名 → {x, y, w, h}
  order.forEach((name, i) => {
    const r = Math.floor(i / perRow), c = i % perRow;
    const t = tables.find(t => t.name === name);
    const x = 20 + c * (W + COL_GAP);
    const y = 20 + rows.slice(0, r).reduce((s, rr) => s + rr.maxH + ROW_GAP, 0);
    pos.set(name, { x, y, w: W, h: cardH(t) });
  });
  const Wpx = perRow * (W + COL_GAP) - COL_GAP + 40;
  const Hpx = rows.reduce((s, rr) => s + rr.maxH + ROW_GAP, 0) - ROW_GAP + 40;

  let svg = `<svg width="${Wpx}" height="${Hpx}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1677ff"/></marker></defs>`;
  // 列索引（表 → 列名 → 行号）
  const colIdx = new Map();
  tables.forEach(t => {
    const m = new Map();
    t.columns.forEach((c, i) => m.set(c.name.includes('.') ? c.name.slice(c.name.indexOf('.') + 1) : c.name, i));
    colIdx.set(t.name, m);
  });
  const lineCounts = new Map(); // 无向表对 → 已画线数（重叠偏移）
  // 字段指向字段：每条关系从 from 列行的卡片边缘点 → to 列行的卡片边缘点
  // （y 精确对准列行，x 在目标侧的卡片边缘——线从字段行高度引出，
  //   视觉上明确指向具体字段而非整张表）
  for (const r of rels) {
    const pa = pos.get(r.from_table), pb = pos.get(r.to_table);
    if (!pa || !pb) continue;
    const ia = colIdx.get(r.from_table).get(r.from_col);
    const ib = colIdx.get(r.to_table).get(r.to_col);
    if (ia === undefined || ib === undefined) continue;
    const ay = pa.y + HEAD_H + ia * ROW_H + ROW_H / 2;
    const by = pb.y + HEAD_H + ib * ROW_H + ROW_H / 2;
    // 边缘锚点：目标在右 → from 右缘出 / to 左缘入；目标在左 → 对称；
    // 同列（上下行）→ 同侧绕出
    const OUT = 18;
    let ex1, ex2, dir;
    if (pa.x < pb.x) { ex1 = pa.x + pa.w; ex2 = pb.x; dir = 1; }
    else if (pa.x > pb.x) { ex1 = pa.x; ex2 = pb.x + pb.w; dir = -1; }
    else { ex1 = pa.x + pa.w / 2; ex2 = ex1; dir = 1; }
    // 同对表多条线（query+反向 read/write）平行偏移，避免完全重叠
    const pairKey = [r.from_table, r.to_table].sort().join('|');
    const n = lineCounts.get(pairKey) || 0;
    lineCounts.set(pairKey, n + 1);
    let dx = 0;
    if (n > 0) dx = (n % 2 === 1 ? -1 : 1) * Math.ceil(n / 2) * 12;
    const color = r.type === 'query' ? '#1677ff' : r.type === 'write' ? '#fa8c16' : '#b0b0b0';
    const style = r.type === 'query'
      ? `stroke:${color};stroke-width:2.2;marker-end:url(#arr)`
      : r.type === 'write'
        ? `stroke:${color};stroke-width:1.6;stroke-dasharray:6,3;marker-end:url(#arr)`
        : `stroke:${color};stroke-width:1;stroke-dasharray:2,3`;
    // 布线（字段行对准）：
    //   同行同字段行 → 水平直线（最清晰）；同行不同字段行 → S 型
    //   （水平出 + 间隙内垂直段 + 水平入）；跨行 → 水平出 + 斜线 + 水平入
    let d, mx, my;
    if (pa.y === pb.y) {
      if (ay === by) {
        d = `M ${ex1 + dx} ${ay} L ${ex2 + dx} ${ay}`;
        mx = (ex1 + ex2) / 2 + dx; my = ay - 6;
      } else {
        const vx = ex1 + dir * OUT;
        d = `M ${ex1 + dx} ${ay} L ${vx + dx} ${ay} L ${vx + dx} ${by} L ${ex2 + dx} ${by}`;
        mx = vx + dx; my = (ay + by) / 2 - 6;
      }
    } else {
      const hx1 = ex1 + dir * OUT, hx2 = ex2 - dir * OUT;
      d = `M ${ex1 + dx} ${ay} L ${hx1 + dx} ${ay} L ${hx2 + dx} ${by} L ${ex2 + dx} ${by}`;
      mx = (hx1 + hx2) / 2 + dx; my = (ay + by) / 2 - 6;
    }
    svg += `<path d="${d}" fill="none" style="${style}"/>`;
    // 标签：路径中点上方（from_col → to_col）
    svg += `<text x="${mx}" y="${my}" class="edge-label" text-anchor="middle">
      <tspan fill="${color}" font-weight="600">${r.from_col}</tspan> → ${r.to_col}
    </text>`;
  }
  // 卡片
  for (const t of tables) {
    const p = pos.get(t.name);
    const h = cardH(t);
    svg += `<rect class="tbl" x="${p.x}" y="${p.y}" width="${W}" height="${h}" rx="6"/>`;
    svg += `<rect class="tbl-head" x="${p.x}" y="${p.y}" width="${W}" height="${HEAD_H}" rx="6"/>`;
    svg += `<rect x="${p.x}" y="${p.y + HEAD_H - 6}" width="${W}" height="6" fill="#2f54eb"/>`;
    svg += `<text class="tbl-title" x="${p.x + 12}" y="${p.y + 21}">${t.name}</text>`;
    t.columns.forEach((c, i) => {
      const cy = p.y + HEAD_H + i * ROW_H + ROW_H - 6;
      if (i % 2 === 1) svg += `<rect class="tbl-row-alt" x="${p.x + 1}" y="${p.y + HEAD_H + i * ROW_H}" width="${W - 2}" height="${ROW_H}"/>`;
      const colName = c.name.includes('.') ? c.name.slice(c.name.indexOf('.') + 1) : c.name;
      const acc = c.access === 'write' ? '写' : c.access === 'filter' ? '过滤' : c.access === 'read' ? '读' : c.access;
      const accClass = c.access === 'write' ? 'acc-write' : c.access === 'filter' ? 'acc-filter' : 'acc-read';
      const accText = acc ? `<tspan class="acc ${accClass}" dx="4">[${acc}]</tspan>` : '';
      svg += `<text class="tbl-row" x="${p.x + 12}" y="${cy}"><tspan class="col" title="${c.name}">${colName}</tspan>${accText}</text>`;
    });
  }
  svg += '</svg>';
  document.getElementById('svg-wrap').innerHTML = svg;
}
load();
</script>
</body>
</html>
